name: Build Plugin

on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - develop
      - main
      - 'version/*'
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Cache IntelliJ SDK downloads (large files, ~500MB+)
      - name: Cache IntelliJ SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/JetBrains
            ~/Library/Caches/JetBrains
            build/idea-sandbox
          key: ${{ runner.os }}-intellij-sdk-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-intellij-sdk-
      
      # Setup Gradle with automatic dependency caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      # Run all tasks in single command to leverage Gradle's incremental build
      - name: Build, test, and verify plugin
        run: ./gradlew buildPlugin test verifyPlugin --no-daemon --parallel
      
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7
