name: Build Plugin

on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - develop
      - main
      - 'version/*'
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Cache IntelliJ SDK and Gradle dependencies
      - name: Cache IntelliJ SDK and Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/JetBrains
            ~/Library/Caches/JetBrains
            build/idea-sandbox
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-intellij-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-intellij-
      
      # Setup Gradle (caching handled by actions/cache above)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      # Run all tasks in single command to leverage Gradle's incremental build
      - name: Build, test, and verify plugin
        run: ./gradlew buildPlugin test verifyPlugin --no-daemon --parallel
      
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7
