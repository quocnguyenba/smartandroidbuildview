name: Release Plugin

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.0.1, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Cache IntelliJ SDK downloads (large files, ~500MB+)
      - name: Cache IntelliJ SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains
            ~/Library/Caches/JetBrains
            build/idea-sandbox
          key: ${{ runner.os }}-intellij-sdk-${{ hashFiles('build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-intellij-sdk-
      
      # Setup Gradle with automatic dependency caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPlugin --no-daemon --parallel

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Uncomment below to publish to JetBrains Marketplace
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}