# IntelliJ Platform Plugin Configuration
# See https://plugins.jetbrains.com/docs/intellij/gradle-prerequisites.html

# Opt-out flag for bundling Kotlin standard library
kotlin.stdlib.default.dependency=false

# Enable Gradle Build Cache (speeds up incremental builds)
org.gradle.caching=true

# Enable Gradle Configuration Cache (faster task execution)
org.gradle.configuration-cache=true

# Parallel execution (use multiple CPU cores)
org.gradle.parallel=true

# Increase memory for better performance (especially for IntelliJ plugin builds)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable Kotlin incremental compilation
kotlin.incremental=true
