<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#3DDC84" opacity="0.15"/>
  
  <!-- Android robot head -->
  <g transform="translate(20, 12)">
    <!-- Antennas -->
    <line x1="-4" y1="-3" x2="-6" y2="-6" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="-3" x2="6" y2="-6" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Head -->
    <rect x="-6" y="-3" width="12" height="8" rx="1.5" fill="#3DDC84"/>
    
    <!-- Eyes -->
    <circle cx="-3" cy="0" r="1" fill="#FFFFFF"/>
    <circle cx="3" cy="0" r="1" fill="#FFFFFF"/>
    
    <!-- Body -->
    <rect x="-5" y="6" width="10" height="6" rx="1" fill="#3DDC84"/>
    
    <!-- Arms -->
    <rect x="-7" y="7" width="1.5" height="5" rx="0.75" fill="#3DDC84"/>
    <rect x="5.5" y="7" width="1.5" height="5" rx="0.75" fill="#3DDC84"/>
  </g>
  
  <!-- Build/Configuration document icon -->
  <g transform="translate(26, 26)">
    <!-- Document -->
    <path d="M -4 -4 L 2 -4 L 4 -2 L 4 4 L -4 4 Z" fill="#1976D2"/>
    <path d="M 2 -4 L 2 -2 L 4 -2" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    
    <!-- Build text lines -->
    <line x1="-2.5" y1="-1" x2="2" y2="-1" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="-2.5" y1="1" x2="2" y2="1" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="-2.5" y1="3" x2="1" y2="3" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>
  </g>
  
  <!-- Gradle elephant (subtle) -->
  <circle cx="12" cy="28" r="2.5" fill="#02303A" opacity="0.3"/>
</svg>
